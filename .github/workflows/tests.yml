name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install clang + libgc and route cc through clang
        # Quartz / glassc try `cc` with -fbracket-depth=100000 (a Clang-only flag
        # that raises the nesting limit for the deeply-nested C they emit) and
        # FALL BACK without it when cc rejects it, so GCC works too (its default
        # nesting limit is higher). Clang is installed here only to also exercise
        # the with-flag path; it is no longer required (GCC is supported).
        # libgc-dev: the native compiler and the programs it emits allocate via
        # the Boehm GC and link -lgc.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgc-dev
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang 100
          cc --version

      - name: Install Glass
        run: pip install -e .

      - name: Run regression suite
        # The heavy native proves run to completion on the runner. _heavy_skipped() is a
        # fallback: a resource-starved runner that signal-kills a heavy prove skips that
        # gate, while a real logic regression (rc < 128) still fails.
        run: python tests/test_glass.py

      - name: Run the self-host capstone
        run: glass examples/selfhost/prism.glass | tail -5

      - name: Run showcase examples
        run: |
          glass examples/showcase/derive.glass | grep -E "⟶" | head
          glass examples/showcase/prover.glass | grep -E "⟶" | head
          glass examples/showcase/nash.glass | grep -E "Nash equilibria" | head


  # The project's defining invariant, on Linux and macOS: native_glassc (the
  # Glass-written compiler) reproduces itself and prism byte-identically, its
  # output matches the reference interpreter, and Lens, the independent
  # verifier, agrees with verify_b3 on an honest proof and rejects tampered ones.
  bootstrap:
    name: fixpoint and Lens (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        # bootstrap_fixpoint.sh calls python3.12 by name.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Native prerequisites (Linux)
        # The emitted C includes <gc.h> and links -lgc (the Boehm GC). Clang is
        # routed through cc to exercise its -fbracket-depth path; GCC also works.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgc-dev
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang 100
          cc --version

      - name: Native prerequisites (macOS)
        # Apple clang is cc; the emitted build passes the Homebrew include and lib paths.
        if: runner.os == 'macOS'
        run: |
          brew install bdw-gc
          cc --version

      - name: Install Glass
        run: pip install -e .

      - name: Bootstrap fixpoint, self-reproduction is byte-identical
        # quartz builds native_glassc; it compiles itself; the second generation
        # compiles prism and its output matches glass.py; both generations emit
        # identical C. The first generation runs with collection off (a known
        # liveness bug in Quartz-built code; see docs/roadmap.md, Stage II).
        run: bash examples/selfhost/bootstrap_fixpoint.sh

      - name: Dogfood, native_glassc output == glass.py, byte-for-byte
        env:
          PYTHON: python3.12
        run: bash examples/selfhost/dogfood.sh examples/frost/frost_m31.glass

      - name: Lens agrees with verify_b3 and rejects tampered proofs
        run: bash lens/difftest.sh

      - name: The proof corpus verifies and every tamper is rejected
        run: python3.12 fuzz/corpus_check.py
